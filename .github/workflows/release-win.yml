name: Build & Release Windows 11 & Ubuntu x64 Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release-Tag (z. B. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Windows 11 x64 NSIS Installer + Tests + Compliance
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typecheck, Build & vollständige Test-Suite (Physik, CAD, Pipeline, Compliance)
        run: npm run build && npm test

      - name: Windows 11 x64 NSIS Installer bauen
        run: npx electron-builder --win nsis --x64 --publish never

      - name: SHA-256 Prüfsummen für Installer erzeugen
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -Filter "*.exe"
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Out-File -FilePath release/SHA256SUMS.txt -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      - name: GitHub Release mit Windows-Installer & rechtlichen Zusätzen erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || 'v1.0.0' }}
          name: Fred, der Klemmbaumeister – Gemini Edition (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || 'v1.0.0' }})
          files: |
            release/*.exe
            release/SHA256SUMS.txt
            LICENSE
            DATENSCHUTZ.md
            LEGAL_NOTICE.md
            SECURITY.md
            COMPLIANCE_MATRIX.md
            THIRD_PARTY_LICENSES.md

  build-linux-installer:
    name: Ubuntu / Linux x64 (.deb & AppImage) + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build & vollständige Test-Suite
        run: npm run build && npm test

      - name: Ubuntu .deb & AppImage Installer bauen
        run: npx electron-builder --linux deb AppImage --x64 --publish never

      - name: SHA-256 Prüfsummen (Linux) erzeugen
        run: |
          cd release
          sha256sum *.deb *.AppImage > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Linux-Installer an GitHub Release anhängen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || 'v1.0.0' }}
          files: |
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS-linux.txt

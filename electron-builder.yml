appId: com.fred.gemini-edition
productName: Fred - Gemini Edition
copyright: Copyright © 2026 Fred Gemini Edition
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - dist-electron/**/*
  - assets/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/fred-icon.ico
  artifactName: "Fred - Gemini Edition Setup.exe"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Fred - Gemini Edition"
  uninstallDisplayName: "Fred, der Klemmbaumeister - Gemini Edition"
linux:
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
  icon: assets/fred-icon.png
  category: Graphics;Education;Engineering
  maintainer: "Dennis Deckena <dennisdeckena-star@users.noreply.github.com>"
  synopsis: "3D-Klemmbaustein-CAD & Bauanleitungs-Desktopsoftware mit Google Gemini"
  desktop:
    entry:
      Name: "Fred - Gemini Edition"
      Comment: "Fred, der Klemmbaumeister – 3D-Klemmbaustein-CAD & Bauanleitungen"
      Categories: "Graphics;Education;Engineering;"
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
